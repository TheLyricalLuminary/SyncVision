# fly.toml app configuration file generated for syncvision on 2026-06-12T19:01:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'syncvision'
primary_region = 'ord'

[build]

[deploy]
  # Migrations must run over the direct (unpooled) Neon connection, never the
  # pooled runtime DATABASE_URL — pooled connections can drop/rebalance mid
  # migration. Fails loudly and refuses to migrate if the secret is absent,
  # rather than silently falling back to the pooled URL.
  release_command = "sh -c 'test -n \"$DATABASE_URL_UNPOOLED\" || { echo \"FATAL: DATABASE_URL_UNPOOLED is not set — refusing to run migrations over the pooled connection.\" >&2; exit 1; }; cd /app/apps/backend && DATABASE_URL=\"$DATABASE_URL_UNPOOLED\" npx prisma migrate deploy'"

[env]
  PORT = "8080"
  AUDIO_STORAGE_PATH = "/var/audio"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = "audio_data"
  destination = "/var/audio"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
